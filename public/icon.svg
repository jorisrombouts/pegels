<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bars" x1="120" y1="150" x2="404" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Soft dark tile; rounded for the non-maskable "any" purpose. -->
  <rect width="512" height="512" rx="112" fill="#0a0b12"/>
  <!-- Pegels = level gauges: three ascending rounded bars (blue -> teal). -->
  <g fill="url(#bars)">
    <rect x="102" y="276" width="76" height="104" rx="30"/>
    <rect x="218" y="212" width="76" height="168" rx="30"/>
    <rect x="334" y="144" width="76" height="236" rx="30"/>
  </g>
</svg>
